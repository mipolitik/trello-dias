<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#172b4d;margin:0;padding:10px 12px}p{margin:0 0 10px}button{font:inherit;padding:6px 14px;border:0;border-radius:6px;background:#0c66e4;color:#fff}#m{margin-left:8px;color:#5e6c84}</style>
</head>
<body>
<p>Para que «Comprobado» deje el comentario y pase la tarjeta a Completado, autorice una sola vez. Después toque «Comprobado» de nuevo.</p>
<p><button id="a">Autorizar</button><span id="m"></span></p>
<script>(function autorizar() {
  var t = window.TrelloPowerUp.iframe({ appKey: '4fd24ab22726e2bcda6691364198bc8a', appName: 'Días en Programación' });
  var m = document.getElementById('m');
  document.getElementById('a').onclick = function () {
    t.getRestApi().authorize({ scope: 'read,write', expiration: 'never' }).then(function () {
      m.textContent = 'Autorizado. Toque «Comprobado» de nuevo.'; setTimeout(function () { t.closePopup(); }, 1500);
    }, function () { m.textContent = 'No se autorizó.'; });
  };
})();</script>
</body>
</html>
