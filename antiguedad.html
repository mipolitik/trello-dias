<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Antigüedad · Programación</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./core.js?v=4"></script>
<style>body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#172b4d;background:#fff;margin:0;padding:14px 16px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#5e6c84;margin:18px 0 8px}#resumen{display:flex;flex-wrap:wrap;gap:8px}.dato{flex:1 1 150px;border:1px solid #dfe1e6;border-radius:8px;padding:8px 10px}.dato b{display:block;font-size:20px}.dato span{color:#5e6c84;font-size:12px}table{width:100%;border-collapse:collapse}th{font-size:12px;color:#5e6c84;text-align:left;padding:6px 8px;border-bottom:2px solid #dfe1e6}td{padding:7px 8px;border-bottom:1px solid #ebecf0;vertical-align:top}.num{text-align:right;white-space:nowrap}th.num{text-align:right}.ro{color:#8a1c1c;font-weight:600}.am{color:#9a5b00;font-weight:600}#filas tr{cursor:pointer}#filas tr:hover{background:#f4f5f7}.nom{max-width:330px}.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.barra select,.barra button{font:inherit;padding:4px 8px;border:1px solid #c1c7d0;border-radius:6px;background:#fff}.barra button:disabled{opacity:.4}#cuenta{color:#5e6c84;font-size:12px;margin-left:auto}</style>
</head>
<body>
<div id="carga">Leyendo el tablero…</div>
<div id="cont" style="display:none">
<div id="resumen"></div>
<h2>Por lista</h2>
<table><thead><tr><th>Lista</th><th class="num">Tarjetas corriendo</th><th class="num">La más antigua lleva</th></tr></thead><tbody id="porlista"></tbody></table>
<h2>De la más antigua a la más nueva</h2>
<div class="barra"><select id="flista"></select><select id="fpp"><option value="5">5 por página</option><option value="10" selected>10 por página</option><option value="25">25 por página</option><option value="50">50 por página</option><option value="0">Todas</option></select><button id="ant">Anterior</button><button id="sig">Siguiente</button><span id="cuenta"></span></div>
<table><thead><tr><th>Tarjeta</th><th>Lista</th><th class="num">En Programación</th><th class="num">En esta lista</th><th class="num">Sin movimiento</th></tr></thead><tbody id="filas"></tbody></table>
</div>
<script>(function pagina() {
  var M = window.MP, t = window.TrelloPowerUp.iframe(), h = M.hoy();
  var E = { lista: '', pp: 10, pg: 0, act: [], c: null };
  function el(tag, txt, cls) { var e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; }
  function tono(n) { return n >= E.c.ro ? 'ro' : (n >= E.c.am ? 'am' : ''); }
  function tabla() {
    var f = E.act.filter(function (x) { return !E.lista || x.ln === E.lista; });
    var pp = E.pp === 0 ? f.length || 1 : E.pp, pags = Math.max(1, Math.ceil(f.length / pp));
    if (E.pg >= pags) E.pg = pags - 1;
    var ini = E.pg * pp, vis = f.slice(ini, ini + pp);
    var tb = document.getElementById('filas'); tb.innerHTML = '';
    vis.forEach(function (x) {
      var tr = el('tr'); tr.onclick = function () { t.showCard(x.id); };
      tr.appendChild(el('td', x.n, 'nom')); tr.appendChild(el('td', x.ln));
      tr.appendChild(el('td', M.txt(x.p), 'num ' + tono(x.p))); tr.appendChild(el('td', M.txt(x.l), 'num'));
      tr.appendChild(el('td', x.sm >= E.c.sm ? M.txt(x.sm) : '—', 'num'));
      tb.appendChild(tr);
    });
    document.getElementById('cuenta').textContent = f.length
      ? 'Mostrando ' + (ini + 1) + '–' + (ini + vis.length) + ' de ' + f.length + (f.length === 1 ? ' tarjeta' : ' tarjetas')
      : 'Sin tarjetas en esta lista';
    document.getElementById('ant').disabled = E.pg <= 0;
    document.getElementById('sig').disabled = E.pg >= pags - 1;
  }
  function pintar(filas, orden) {
    E.act = filas.filter(function (x) { return !x.fin && !x.sinDato; }).sort(function (a, b) { return b.p - a.p || b.l - a.l; });
    var res = filas.filter(function (x) { return x.fin && x.t != null; });
    var prob = E.act.filter(function (x) { return M.RE.prod.test(x.ln); }).length;
    var volv = filas.filter(function (x) { return x.v > 0; }).length;
    var R = document.getElementById('resumen'); R.innerHTML = '';
    function dato(n, rot) { var d = el('div', null, 'dato'); d.appendChild(el('b', String(n))); d.appendChild(el('span', rot)); R.appendChild(d); }
    dato(E.act.length, E.act.length === 1 ? 'tarjeta corriendo' : 'tarjetas corriendo');
    dato(E.act.length ? M.txt(E.act[0].p) : '—', 'lleva la más antigua');
    dato(prob, prob === 1 ? 'tarjeta nos toca probar' : 'tarjetas nos toca probar');
    dato(volv, volv === 1 ? 'tarjeta volvió' : 'tarjetas volvieron');
    if (res.length) {
      var pr = res.reduce(function (s, x) { return s + x.t; }, 0) / res.length;
      dato(String(Math.round(pr * 10) / 10).replace('.', ',') + ' días', 'promedio por tarjeta resuelta (' + res.length + ')');
    } else dato('—', 'sin tarjetas resueltas todavía');
    var L = document.getElementById('porlista'); L.innerHTML = '';
    var sel = document.getElementById('flista'); sel.innerHTML = ''; var o0 = el('option', 'Todas las listas'); o0.value = ''; sel.appendChild(o0);
    orden.forEach(function (ln) {
      var g = E.act.filter(function (x) { return x.ln === ln; }); if (!g.length) return;
      var tr = el('tr'); tr.appendChild(el('td', ln)); tr.appendChild(el('td', String(g.length), 'num'));
      tr.appendChild(el('td', M.txt(g[0].p), 'num ' + tono(g[0].p))); L.appendChild(tr);
      var o = el('option', ln + ' (' + g.length + ')'); o.value = ln; sel.appendChild(o);
    });
    sel.onchange = function () { E.lista = sel.value; E.pg = 0; tabla(); };
    var spp = document.getElementById('fpp');
    spp.onchange = function () { E.pp = +spp.value; E.pg = 0; tabla(); };
    document.getElementById('ant').onclick = function () { E.pg--; tabla(); };
    document.getElementById('sig').onclick = function () { E.pg++; tabla(); };
    document.getElementById('carga').style.display = 'none';
    document.getElementById('cont').style.display = 'block';
    tabla();
  }
  Promise.all([
    t.cards('id', 'name', 'shortLink', 'idList', 'labels', 'dueComplete', 'dateLastActivity'),
    t.lists('id', 'name'),
    t.get('board', 'shared', 'seed'),
    t.get('board', 'shared', 'cfg')
  ]).then(function (r) {
    var cards = r[0], lists = r[1], seed = r[2] || {}; E.c = M.cfg(r[3]);
    var nom = {}; lists.forEach(function (l) { nom[l.id] = l.name; });
    return Promise.all(cards.map(function (cd) {
      return t.get(cd.id, 'shared', 'd').then(function (d) { return d || null; }, function () { return null; });
    })).then(function (ds) {
      pintar(cards.map(function (cd, i) {
        var ln = nom[cd.idList] || '', x = M.calc(cd, ln, seed, ds[i], h);
        x.n = cd.name; x.id = cd.id; x.ln = ln; return x;
      }), lists.map(function (l) { return l.name; }));
    });
  }).catch(function () { document.getElementById('carga').textContent = 'No se pudo leer el tablero.'; });
})();</script>
</body>
</html>
